name: Deploy to Linux server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Deploy application on server
        uses: appleboy/ssh-action@v1.2.0

        env:
          DEPLOY_PATH: ${{ secrets.SERVER_PATH || '/home/ubuntu/restaurant-menu' }}
          BACKEND_ENV_B64: ${{ secrets.BACKEND_ENV_B64 }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}

          envs: DEPLOY_PATH,BACKEND_ENV_B64

          command_timeout: 15m

          script: |
            set -euo pipefail

            echo "=== Enter deploy directory ==="
            cd "$DEPLOY_PATH"


            echo "=== Updating repository ==="

            git config --global --add safe.directory "$DEPLOY_PATH"
            
            git fetch origin main

            git reset --hard origin/main


            echo "=== Current commit ==="

            git log -1 --oneline


            echo "=== Writing backend environment ==="

            mkdir -p Backend

            echo "$BACKEND_ENV_B64" | base64 -d > Backend/.env


            echo "=== Checking Docker installation ==="

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found. Installing..."

              chmod +x scripts/setup-server.sh
              ./scripts/setup-server.sh
            else
              echo "Docker already installed"
            fi


            echo "=== Deploying containers ==="

            chmod +x scripts/deploy.sh

            ./scripts/deploy.sh


            echo "=== Deployment completed successfully ==="

            docker compose ps