services:
  # Frontend Service (Angular + Nginx)
  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: restaurant_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NGINX_HOST: frontend
      NGINX_PORT: 80
    networks:
      - restaurant_network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Backend Service (Python Flask API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant_backend
    restart: always
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - restaurant_network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:${SERVER_PORT}/api/health\")' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    environment:
      - SERVER_IP=0.0.0.0

  # Database Service (MySQL)
  db:
    image: mysql:8.0.36
    container_name: restaurant_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./restaurant.sql:/docker-entrypoint-initdb.d/restaurant.sql
    networks:
      - restaurant_network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --default-time-zone=+03:30
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

networks:
  restaurant_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local