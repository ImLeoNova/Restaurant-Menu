<div
  class="toast-card relative overflow-hidden rounded-2xl border bg-[#12172a]/95 backdrop-blur-xl shadow-[0_16px_40px_-12px_rgba(0,0,0,0.55)] pl-4 pr-4 py-3.5 flex items-start gap-3"
  [class.toast-leaving]="leaving()"
  [ngClass]="{
    'border-emerald-400/25': toast.type === 'success',
    'border-rose-400/25': toast.type === 'error',
    'border-amber-400/25': toast.type === 'warning',
    'border-sky-400/25': toast.type === 'info'
  }"
>
  <div
    class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 mt-0.5"
    [ngClass]="{
      'bg-emerald-500/15 text-emerald-300': toast.type === 'success',
      'bg-rose-500/15 text-rose-300': toast.type === 'error',
      'bg-amber-500/15 text-amber-300': toast.type === 'warning',
      'bg-sky-500/15 text-sky-300': toast.type === 'info'
    }"
  >
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
      <path
        [attr.d]="iconPath"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>

  <div class="flex-1 min-w-0 pt-0.5">
    <p class="yekan text-white font-bold text-sm leading-5">
      {{ toast.title }}
    </p>
    <p class="yekan text-white/60 text-[0.8rem] leading-6 mt-0.5">
      {{ toast.message }}
    </p>
  </div>

  <button
    type="button"
    (click)="close()"
    class="shrink-0 w-6 h-6 rounded-lg flex items-center justify-center text-white/35 hover:text-white hover:bg-white/10 transition-colors"
    aria-label="بستن"
  >
    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none">
      <path
        d="M6 6l12 12M18 6L6 18"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  @if (toast.duration > 0) {
    <div
      class="toast-progress absolute bottom-0 right-0 h-[3px] rounded-full"
      [ngClass]="{
        'bg-emerald-400/70': toast.type === 'success',
        'bg-rose-400/70': toast.type === 'error',
        'bg-amber-400/70': toast.type === 'warning',
        'bg-sky-400/70': toast.type === 'info'
      }"
      [style.animation-duration.ms]="toast.duration"
    ></div>
  }
</div>
