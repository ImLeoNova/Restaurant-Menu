<div
  class="fixed top-5 left-5 z-[9999] w-[min(92vw,380px)] flex flex-col gap-3 pointer-events-none"
  dir="rtl"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <app-toast-item
      class="pointer-events-auto block"
      [toast]="toast"
      (dismissed)="toastService.dismiss($event)"
    ></app-toast-item>
  }
</div>
