<aside
  class="w-full lg:w-[18rem] lg:min-h-screen border-b lg:border-b-0 lg:border-l border-white/10 bg-white/5 backdrop-blur-2xl shadow-2xl flex flex-col justify-between shrink-0"
>
  <div>
    <div class="p-4 sm:p-6 border-b border-white/10">
      <div class="flex items-center gap-3" dir="rtl">
        <div
          class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl overflow-hidden bg-white/10 border border-white/10 flex items-center justify-center shrink-0"
        >
          <img
            src="assets/web/logo.png"
            alt="logo"
            class="w-8 h-8 sm:w-10 sm:h-10 object-contain"
          />
        </div>
        <div class="flex flex-col min-w-0">
          <h1
            class="yekan font-extrabold text-[1rem] sm:text-[1.1rem] text-white truncate"
          >
            پنل مدیریت
          </h1>
          <p
            class="yekan text-[0.75rem] sm:text-[0.8rem] text-white/60 truncate"
          >
            داشبورد رستوران
          </p>
        </div>
      </div>
    </div>

    <div class="p-3 sm:p-4">
      <div
        class="rounded-3xl p-4 border shadow-xl"
        [ngClass]="{
          'bg-gradient-to-br from-amber-500/25 to-orange-500/10 border-amber-400/30':
            user.role === Roles.USER,
          'bg-gradient-to-br from-blue-500/25 to-cyan-500/10 border-cyan-400/30':
            user.role === Roles.ADMIN,
          'bg-gradient-to-br from-rose-500/25 to-fuchsia-500/10 border-rose-400/30':
            user.role === Roles.FOUNDER,
        }"
      >
        <div class="flex items-center justify-between gap-3" dir="rtl">
          <div class="flex flex-col gap-1 min-w-0">
            <span class="yekan text-white/70 text-[0.8rem]">خوش آمدی</span>
            <h2 class="yekan text-[1rem] sm:text-[1.1rem] font-bold truncate">
              {{ user.username }}
            </h2>
          </div>

          <div
            class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-white/10 flex items-center justify-center border border-white/10 shrink-0"
          >
            <svg
              class="w-5 h-5 sm:w-6 sm:h-6 text-white"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M4 20a8 8 0 0 1 16 0"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <nav class="px-3 pb-4 sm:pb-6 flex flex-col gap-2" dir="rtl">
      <div
        (click)="pageChange.emit('home')"
        class="group cursor-pointer rounded-2xl px-4 py-3.5 sm:py-4 flex items-center justify-between transition-all duration-300 border border-transparent hover:border-white/10 hover:bg-white/10"
        [ngClass]="{
          'bg-white/10 border-white/10 shadow-lg': nowPage === 'home',
        }"
      >
        <div class="flex items-center gap-3 min-w-0">
          <div
            class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center shrink-0"
          >
            <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none">
              <path
                d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.5Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <h1 class="yekan font-semibold truncate">خانه</h1>
        </div>
      </div>

      @if (user.role == Roles.ADMIN || user.role == Roles.FOUNDER) {
        <div
          (click)="pageChange.emit('products')"
          class="group cursor-pointer rounded-2xl px-4 py-3.5 sm:py-4 flex items-center justify-between transition-all duration-300 border border-transparent hover:border-white/10 hover:bg-white/10"
          [ngClass]="{
            'bg-white/10 border-white/10 shadow-lg': nowPage === 'products',
          }"
        >
          <div class="flex items-center gap-3 min-w-0">
            <div
              class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center shrink-0"
            >
              <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none">
                <path
                  d="M4 7.5 12 4l8 3.5M4 7.5V16L12 20m-8-12.5L12 11m8-3.5V16L12 20m0-9v9"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <h1 class="yekan font-semibold truncate">محصولات</h1>
          </div>
        </div>

        <div
          (click)="pageChange.emit('categories')"
          class="group cursor-pointer rounded-2xl px-4 py-3.5 sm:py-4 flex items-center justify-between transition-all duration-300 border border-transparent hover:border-white/10 hover:bg-white/10"
          [ngClass]="{
            'bg-white/10 border-white/10 shadow-lg': nowPage === 'categories',
          }"
        >
          <div class="flex items-center gap-3 min-w-0">
            <div
              class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center shrink-0"
            >
              <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none">
                <path
                  d="M4 6h7v7H4V6Zm9 0h7v4h-7V6Zm0 7h7v5h-7v-5ZM4 15h7v3H4v-3Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <h1 class="yekan font-semibold truncate">دسته‌بندی‌ها</h1>
          </div>
        </div>
      }

      @if (user.role == Roles.FOUNDER) {
        <div
          (click)="pageChange.emit('users')"
          class="group cursor-pointer rounded-2xl px-4 py-3.5 sm:py-4 flex items-center justify-between transition-all duration-300 border border-transparent hover:border-white/10 hover:bg-white/10"
          [ngClass]="{
            'bg-white/10 border-white/10 shadow-lg': nowPage === 'users',
          }"
        >
          <div class="flex items-center gap-3 min-w-0">
            <div
              class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center shrink-0"
            >
              <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none">
                <path
                  d="M16 19a4 4 0 0 0-8 0"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
                <circle
                  cx="12"
                  cy="11"
                  r="3"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M5 19a3 3 0 0 1 3-3M19 19a3 3 0 0 0-3-3M7.5 9.5A2.5 2.5 0 1 0 7.5 4.5M16.5 9.5A2.5 2.5 0 1 1 16.5 4.5"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <h1 class="yekan font-semibold truncate">کاربران</h1>
          </div>
        </div>
      }
    </nav>
  </div>

  <div class="p-3 sm:p-4 border-t border-white/10 flex flex-col gap-2">
    <div
      routerLink="/restaurant-menu"
      class="cursor-pointer rounded-2xl px-4 py-3.5 sm:py-4 flex items-center justify-between bg-gradient-to-r from-red-500 to-rose-600 hover:scale-[1.01] transition-all duration-300 shadow-lg"
      dir="rtl"
    >
      <div class="flex items-center gap-3 min-w-0">
        <div
          class="w-10 h-10 rounded-xl bg-white/15 flex items-center justify-center shrink-0"
        >
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none">
            <path
              d="M10 7 5 12l5 5M6 12h13"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <span class="yekan font-bold truncate">برگشت به سایت</span>
      </div>
    </div>

    <button
      type="button"
      (click)="logoutClick.emit()"
      class="group w-full cursor-pointer rounded-2xl px-4 py-3.5 sm:py-4 flex items-center justify-between bg-white/5 border border-red-400/20 hover:bg-red-500/10 hover:border-red-400/40 transition-all duration-300"
      dir="rtl"
    >
      <div class="flex items-center gap-3 min-w-0">
        <div
          class="w-10 h-10 rounded-xl bg-red-500/10 flex items-center justify-center shrink-0 transition-colors duration-300 group-hover:bg-red-500/20"
        >
          <svg class="w-5 h-5 text-red-400" viewBox="0 0 24 24" fill="none">
            <path
              d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <polyline
              points="16 17 21 12 16 7"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <line
              x1="21"
              y1="12"
              x2="9"
              y2="12"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <span class="yekan font-bold text-red-400 truncate">خروج از حساب</span>
      </div>
    </button>
  </div>
</aside>
