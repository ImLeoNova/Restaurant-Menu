<section
  class="rounded-[2rem] border border-white/10 bg-white/5 backdrop-blur-xl p-4 sm:p-6 lg:p-8"
  dir="rtl"
>
  @if (isLoading) {
    <div class="flex min-h-[24rem] items-center justify-center">
      <div
        class="h-12 w-12 animate-spin rounded-full border-4 border-amber-500/20 border-t-amber-400"
      ></div>
    </div>
  } @else {
    <div class="flex flex-col gap-6">
      <div
        class="flex flex-col items-center gap-4 rounded-[1.8rem] border border-white/10 bg-black/20 p-6 text-center"
      >
        <div class="relative">
          @if (getAvatarSource()) {
            <img
              [src]="getAvatarSource()"
              alt="avatar"
              class="h-28 w-28 rounded-full object-cover border border-white/10 shadow-2xl"
            />
          } @else {
            <div
              class="flex h-28 w-28 items-center justify-center rounded-full border border-white/10 bg-gradient-to-br from-amber-400/30 to-orange-500/20 text-3xl font-extrabold text-amber-100"
            >
              {{ getInitials() }}
            </div>
          }
        </div>

        <div class="flex flex-wrap items-center justify-center gap-3">
          <label
            class="cursor-pointer rounded-2xl border border-amber-400/20 bg-amber-500/10 px-4 py-2.5 text-sm font-bold text-amber-300"
          >
            تغییر عکس
            <input
              type="file"
              accept="image/*"
              class="hidden"
              (change)="onAvatarSelected($event)"
            />
          </label>
          <button
            type="button"
            (click)="uploadAvatar()"
            [disabled]="!avatarFile || isSubmitting"
            class="rounded-2xl border border-emerald-400/20 bg-emerald-500/10 px-4 py-2.5 text-sm font-bold text-emerald-300 disabled:opacity-50"
          >
            ثبت عکس
          </button>
          <button
            type="button"
            (click)="removeAvatar()"
            [disabled]="isSubmitting"
            class="rounded-2xl border border-rose-400/20 bg-rose-500/10 px-4 py-2.5 text-sm font-bold text-rose-300 disabled:opacity-50"
          >
            حذف عکس
          </button>
        </div>
      </div>

      @if (errorMessage) {
        <div
          class="rounded-2xl border border-rose-500/20 bg-rose-500/10 px-4 py-3 text-sm font-bold text-rose-300"
        >
          {{ errorMessage }}
        </div>
      }

      @if (successMessage) {
        <div
          class="rounded-2xl border border-emerald-500/20 bg-emerald-500/10 px-4 py-3 text-sm font-bold text-emerald-300"
        >
          {{ successMessage }}
        </div>
      }

      <form
        [formGroup]="form"
        class="flex flex-col gap-5"
        (ngSubmit)="saveProfile()"
      >
        <div class="grid gap-4 sm:grid-cols-2">
          <div class="flex flex-col gap-2">
            <label class="yekan text-sm font-semibold text-white/80">نام</label>
            <input
              formControlName="first_name"
              type="text"
              placeholder="نام"
              class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none focus:border-amber-400"
            />
          </div>
          <div class="flex flex-col gap-2">
            <label class="yekan text-sm font-semibold text-white/80"
              >نام خانوادگی</label
            >
            <input
              formControlName="last_name"
              type="text"
              placeholder="نام خانوادگی"
              class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none focus:border-amber-400"
            />
          </div>
          <div class="flex flex-col gap-2">
            <label class="yekan text-sm font-semibold text-white/80"
              >تلفن</label
            >
            <input
              formControlName="phone_number"
              type="text"
              placeholder="0912..."
              class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none focus:border-amber-400"
            />
          </div>
          <div class="flex flex-col gap-2">
            <label class="yekan text-sm font-semibold text-white/80"
              >کد ملی</label
            >
            <input
              formControlName="national_id"
              type="text"
              placeholder="کد ملی"
              class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none focus:border-amber-400"
            />
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label class="yekan text-sm font-semibold text-white/80">آدرس</label>
          <textarea
            formControlName="address"
            rows="4"
            placeholder="آدرس کامل"
            class="w-full resize-none rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none focus:border-amber-400"
          ></textarea>
        </div>

        <div class="flex justify-end">
          <button
            type="submit"
            [disabled]="isSubmitting"
            class="rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 px-6 py-3 font-bold text-black disabled:opacity-60"
          >
            {{ isSubmitting ? "در حال ذخیره..." : "ذخیره تغییرات" }}
          </button>
        </div>
      </form>
    </div>
  }
</section>
