<div class="space-y-5 sm:space-y-6" dir="rtl">

  <!-- Analytics & Reports (Admin / Founder) -->
  <app-dashboard-reports
    *ngIf="isAdminOrFounder"
    [userRole]="userRole"
    (filterOrdersByStatus)="filterOrdersByStatus.emit($event)"
    (openOrder)="openOrder.emit($event)"
  ></app-dashboard-reports>

  <!-- Existing 4 KPI cards -->
  <div
    class="grid grid-cols-1 sm:grid-cols-2 2xl:grid-cols-4 gap-4 sm:gap-5"
  >
    <div
      class="rounded-[1.5rem] sm:rounded-[1.8rem] border border-white/10 bg-white/5 p-4 sm:p-5 backdrop-blur-xl shadow-lg min-w-0"
    >
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="yekan text-white/60 text-[0.85rem] sm:text-[0.9rem]">
            تعداد محصولات
          </p>
          <h2
            class="yekan text-[1.6rem] sm:text-[2rem] font-extrabold mt-2 truncate"
          >
            {{ productsCount }}
          </h2>
        </div>
        <div
          class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-amber-500/20 flex items-center justify-center shrink-0"
        >
          <svg
            class="w-6 h-6 sm:w-7 sm:h-7 text-amber-300"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M4 7.5 12 4l8 3.5M4 7.5V16L12 20m-8-12.5L12 11m8-3.5V16L12 20m0-9v9"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
    </div>

    <div
      class="rounded-[1.5rem] sm:rounded-[1.8rem] border border-white/10 bg-white/5 p-4 sm:p-5 backdrop-blur-xl shadow-lg min-w-0"
    >
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="yekan text-white/60 text-[0.85rem] sm:text-[0.9rem]">
            محصولات این دسته
          </p>
          <h2
            class="yekan text-[1.6rem] sm:text-[2rem] font-extrabold mt-2 truncate"
          >
            {{ categoryProductsCount }}
          </h2>
        </div>
        <div
          class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-green-500/20 flex items-center justify-center shrink-0"
        >
          <svg
            class="w-6 h-6 sm:w-7 sm:h-7 text-green-300"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M7 7h10l1 10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L7 7Z"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M9 7a3 3 0 0 1 6 0"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>
    </div>

    <div
      class="rounded-[1.5rem] sm:rounded-[1.8rem] border border-white/10 bg-white/5 p-4 sm:p-5 backdrop-blur-xl shadow-lg min-w-0"
    >
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="yekan text-white/60 text-[0.85rem] sm:text-[0.9rem]">
            دسته‌بندی فعال
          </p>
          <h2
            class="yekan text-[1.15rem] sm:text-[1.4rem] font-extrabold mt-2 break-words"
          >
            {{ activeCategory || "انتخاب نشده" }}
          </h2>
        </div>
        <div
          class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-cyan-500/20 flex items-center justify-center shrink-0"
        >
          <svg
            class="w-6 h-6 sm:w-7 sm:h-7 text-cyan-300"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path d="M5 5h14v14H5z" stroke="currentColor" stroke-width="1.8" />
            <path d="M9 9h6v6H9z" stroke="currentColor" stroke-width="1.8" />
          </svg>
        </div>
      </div>
    </div>

    <div
      class="rounded-[1.5rem] sm:rounded-[1.8rem] border border-white/10 bg-white/5 p-4 sm:p-5 backdrop-blur-xl shadow-lg min-w-0"
    >
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="yekan text-white/60 text-[0.85rem] sm:text-[0.9rem]">
            نقش کاربر
          </p>
          <h2
            class="yekan text-[1.15rem] sm:text-[1.4rem] font-extrabold mt-2 break-words"
          >
            {{ userRole }}
          </h2>
        </div>
        <div
          class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-fuchsia-500/20 flex items-center justify-center shrink-0"
        >
          <svg
            class="w-6 h-6 sm:w-7 sm:h-7 text-fuchsia-300"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M4 20a8 8 0 0 1 16 0"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
