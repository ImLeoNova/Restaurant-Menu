<div
  class="group relative overflow-hidden rounded-[1.8rem] border transition-all duration-300 hover:-translate-y-1.5 hover:shadow-2xl"
  [ngClass]="{
    'bg-gradient-to-br from-amber-500/10 to-orange-500/5 border-amber-400/20 hover:border-amber-400/40 hover:shadow-amber-500/10':
      user.role === Roles.ADMIN,
    'bg-gradient-to-br from-emerald-500/10 to-green-600/5 border-emerald-400/20 hover:border-emerald-400/40 hover:shadow-emerald-500/10':
      user.role === Roles.USER,
    'bg-gradient-to-br from-purple-500/10 to-fuchsia-500/5 border-purple-400/20 hover:border-purple-400/40 hover:shadow-purple-500/10':
      user.role === Roles.FOUNDER,
  }"
>
  <div
    class="absolute -top-10 -right-10 w-36 h-36 rounded-full blur-[55px] opacity-30 group-hover:opacity-60 transition-opacity duration-300"
    [ngClass]="{
      'bg-amber-400': user.role === Roles.ADMIN,
      'bg-emerald-400': user.role === Roles.USER,
      'bg-purple-400': user.role === Roles.FOUNDER,
    }"
  ></div>

  <div class="relative z-10 p-5 flex flex-col gap-4">
    <div class="flex items-start justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div
          class="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0 font-extrabold text-[1.4rem] shadow-lg overflow-hidden"
          [ngClass]="{
            'bg-gradient-to-br from-amber-400/50 to-orange-500/40 border border-amber-400/50 text-amber-100':
              user.role === Roles.ADMIN,
            'bg-gradient-to-br from-emerald-400/50 to-green-500/40 border border-emerald-400/50 text-emerald-100':
              user.role === Roles.USER,
            'bg-gradient-to-br from-purple-400/50 to-fuchsia-500/40 border border-purple-400/50 text-purple-100':
              user.role === Roles.FOUNDER,
          }"
        >
          @if (user.avatar) {
            <img
              [src]="user.avatar"
              alt="avatar"
              class="h-full w-full object-cover"
            />
          } @else {
            {{ (user.first_name || user.username).charAt(0).toUpperCase() }}
          }
        </div>

        <div class="min-w-0">
          <h2 class="yekan text-white font-extrabold text-[1.05rem] truncate">
            {{ user.username }}
          </h2>
          <p class="yekan text-white/40 text-[0.78rem] truncate mt-0.5">
            {{ user.email }}
          </p>
        </div>
      </div>

      <span
        class="yekan text-[0.72rem] font-bold px-3 py-1.5 rounded-xl shrink-0 mt-1"
        [ngClass]="{
          'bg-amber-500/20 text-amber-300 border border-amber-400/30':
            user.role === Roles.ADMIN,
          'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30':
            user.role === Roles.USER,
          'bg-purple-500/20 text-purple-300 border border-purple-400/30':
            user.role === Roles.FOUNDER,
        }"
      >
        {{
          user.role === Roles.ADMIN
            ? "ادمین"
            : user.role === Roles.FOUNDER
              ? "مدیر"
              : "کاربر"
        }}
      </span>
    </div>

    <div
      class="h-px w-full"
      [ngClass]="{
        'bg-gradient-to-r from-amber-400/40 to-transparent':
          user.role === Roles.ADMIN,
        'bg-gradient-to-r from-emerald-400/40 to-transparent':
          user.role === Roles.USER,
        'bg-gradient-to-r from-purple-400/40 to-transparent':
          user.role === Roles.FOUNDER,
      }"
    ></div>

    <div class="flex items-center gap-2.5 px-1">
      <div
        class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0"
        [ngClass]="{
          'bg-amber-500/15': user.role === Roles.ADMIN,
          'bg-emerald-500/15': user.role === Roles.USER,
          'bg-purple-500/15': user.role === Roles.FOUNDER,
        }"
      >
        <svg
          class="w-3.5 h-3.5"
          [ngClass]="{
            'text-amber-400': user.role === Roles.ADMIN,
            'text-emerald-400': user.role === Roles.USER,
            'text-purple-400': user.role === Roles.FOUNDER,
          }"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="m22 6-10 7L2 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <span class="yekan text-white/55 text-[0.82rem] truncate">{{
        user.email
      }}</span>
    </div>

    <div class="flex gap-2 mt-1">
      <button
        (click)="edit.emit(user)"
        class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl bg-amber-500/10 border border-amber-400/25 hover:bg-amber-500/25 hover:border-amber-400/60 transition-all duration-200"
      >
        <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="none">
          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
        <span class="yekan text-amber-400 text-[0.8rem] font-bold">ویرایش</span>
      </button>

      <button
        (click)="remove.emit(user)"
        class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl bg-red-500/10 border border-red-400/25 hover:bg-red-500/25 hover:border-red-400/60 transition-all duration-200"
      >
        <svg class="w-3.5 h-3.5 text-red-400" viewBox="0 0 24 24" fill="none">
          <path
            d="M6 7h12M9 7V5h6v2m-7 3v7m4-7v7M8 19h8a1 1 0 0 0 1-1V7H7v11a1 1 0 0 0 1 1Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
        <span class="yekan text-red-400 text-[0.8rem] font-bold">حذف</span>
      </button>
    </div>
  </div>
</div>
