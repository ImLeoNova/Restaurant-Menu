<div
  class="w-full max-w-[40rem] rounded-[1.5rem] sm:rounded-[2rem] border border-white/10 bg-[#111827]/95 text-white shadow-2xl overflow-hidden my-6"
  dir="rtl"
  [formGroup]="form"
>
  <div
    class="p-4 sm:p-6 border-b border-white/10 flex items-center justify-between gap-3 bg-white/5"
  >
    <div class="flex items-center gap-3 min-w-0">
      <div
        class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-amber-500/15 flex items-center justify-center border border-amber-400/20 shrink-0"
      >
        <svg
          class="w-5 h-5 sm:w-6 sm:h-6 text-amber-300"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <circle
            cx="9"
            cy="7"
            r="4"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <div class="min-w-0">
        <h2 class="yekan text-[1.1rem] sm:text-[1.4rem] font-extrabold">
          افزودن کاربر
        </h2>
        <p class="yekan text-white/50 text-[0.8rem] sm:text-[0.85rem]">
          اطلاعات کاربر جدید را وارد کنید
        </p>
      </div>
    </div>
    <button
      (click)="close.emit()"
      class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl border border-white/10 bg-white/5 hover:bg-red-500/20 transition-all flex items-center justify-center shrink-0"
    >
      <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none">
        <path
          d="M6 6l12 12M18 6 6 18"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>

  <div class="p-4 sm:p-6 flex flex-col gap-5">
    <div class="flex flex-col gap-2">
      <label class="yekan font-semibold text-white/90">نام کاربری</label>
      <input
        formControlName="username"
        type="text"
        placeholder="نام کاربری..."
        class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-4 text-white outline-none focus:border-amber-400 transition-all"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="yekan font-semibold text-white/90">ایمیل</label>
      <input
        formControlName="email"
        type="email"
        placeholder="ایمیل..."
        class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-4 text-white outline-none focus:border-amber-400 transition-all"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="yekan font-semibold text-white/90">رمز عبور</label>
      <input
        formControlName="password"
        type="password"
        placeholder="رمز عبور..."
        class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-4 text-white outline-none focus:border-amber-400 transition-all"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="yekan font-semibold text-white/90">نقش کاربر</label>
      <div class="grid grid-cols-3 gap-3">
        @for (role of roleOptions; track role.value) {
          <div
            (click)="setRole(role.value)"
            class="cursor-pointer rounded-2xl py-3 text-center border transition-all duration-200 yekan font-bold text-[0.85rem]"
            [ngClass]="{
              'bg-emerald-500/25 border-emerald-400/60 text-emerald-300':
                form.get('role')?.value === role.value &&
                role.color === 'emerald',
              'bg-amber-500/25 border-amber-400/60 text-amber-300':
                form.get('role')?.value === role.value && role.color === 'amber',
              'bg-purple-500/25 border-purple-400/60 text-purple-300':
                form.get('role')?.value === role.value && role.color === 'purple',
              'bg-white/5 border-white/10 text-white/50 hover:bg-white/10':
                form.get('role')?.value !== role.value,
            }"
          >
            {{ role.label }}
          </div>
        }
      </div>
    </div>

    @if (errorMessage !== undefined) {
      <div class="rounded-2xl border border-rose-500/20 bg-rose-500/10 px-4 py-3">
        <h1 class="yekan text-[0.85rem] font-bold text-rose-300">
          {{ errorMessage }}
        </h1>
      </div>
    }
    @if (successMessage !== undefined) {
      <div class="rounded-2xl border border-emerald-500/20 bg-emerald-500/10 px-4 py-3">
        <h1 class="yekan text-[0.85rem] font-bold text-emerald-300">
          {{ successMessage }}
        </h1>
      </div>
    }

    <div class="flex flex-col sm:flex-row gap-3 mt-1">
      <button
        (click)="submitForm.emit()"
        class="flex-1 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 px-6 py-4 yekan font-bold text-white hover:scale-[1.01] transition-all shadow-lg flex items-center justify-center gap-3"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 5v14M5 12h14"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        افزودن کاربر
      </button>
      <button
        (click)="close.emit()"
        class="rounded-2xl border border-red-400/20 bg-red-500/10 px-6 py-4 yekan font-bold text-red-300 hover:bg-red-500/20 transition-all"
      >
        بستن
      </button>
    </div>
  </div>
</div>
