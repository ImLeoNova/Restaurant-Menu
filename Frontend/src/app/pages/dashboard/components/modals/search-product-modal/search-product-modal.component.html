<div
  class="w-full max-w-[40rem] rounded-[1.5rem] sm:rounded-[2rem] border border-white/10 bg-[#111827]/95 text-white shadow-2xl p-4 sm:p-6 my-6"
  dir="rtl"
>
  <div class="flex items-center justify-between gap-3 mb-6">
    <div class="flex items-center gap-3 min-w-0">
      <div
        class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-blue-500/15 flex items-center justify-center border border-blue-400/20 shrink-0"
      >
        <svg
          class="w-5 h-5 sm:w-6 sm:h-6 text-blue-300"
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            cx="11"
            cy="11"
            r="6"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="m20 20-4.2-4.2"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <div class="min-w-0">
        <h2 class="yekan text-[1.1rem] sm:text-[1.3rem] font-extrabold">
          جستجوی محصول
        </h2>
        <p class="yekan text-white/50 text-[0.8rem] sm:text-[0.85rem]">
          نام محصول مورد نظر را وارد کن
        </p>
      </div>
    </div>

    <button
      (click)="close.emit()"
      class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl border border-white/10 bg-white/5 hover:bg-red-500/20 transition-all flex items-center justify-center shrink-0"
    >
      <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none">
        <path
          d="M6 6l12 12M18 6 6 18"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>

  <div class="flex flex-col gap-4">
    <input
      [ngModel]="searchKeyword"
      (ngModelChange)="searchKeywordChange.emit($event)"
      type="text"
      placeholder="جستجو بر اساس نام محصول..."
      class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-4 text-white outline-none focus:border-blue-400 transition-all"
    />

    <div class="flex flex-col sm:flex-row gap-3">
      <button
        (click)="search.emit()"
        class="rounded-2xl bg-gradient-to-r from-blue-500 to-cyan-600 px-6 py-4 yekan font-bold text-white hover:scale-[1.01] transition-all duration-300 shadow-lg"
      >
        جستجو
      </button>
      <button
        (click)="close.emit()"
        class="rounded-2xl border border-white/10 bg-white/5 px-6 py-4 yekan font-bold text-white hover:bg-white/10 transition-all duration-300"
      >
        بستن
      </button>
    </div>
  </div>
</div>
