<div
  class="w-full max-w-[40rem] rounded-[1.5rem] sm:rounded-[2rem] border border-white/10 bg-[#111827]/95 text-white shadow-2xl overflow-hidden my-6"
  dir="rtl"
>
  <div
    class="p-4 sm:p-6 border-b border-white/10 flex items-center justify-between gap-3 bg-white/5"
  >
    <div class="flex items-center gap-3 min-w-0">
      <div
        class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-amber-500/15 flex items-center justify-center border border-amber-400/20 shrink-0"
      >
        <svg
          class="w-5 h-5 sm:w-6 sm:h-6 text-amber-300"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M12 5v14M5 12h14"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <div class="min-w-0">
        <h2 class="yekan text-[1.1rem] sm:text-[1.35rem] font-extrabold">
          افزودن دسته‌بندی
        </h2>
        <p class="yekan text-white/50 text-[0.8rem]">
          عنوان، شناسه انگلیسی و تصویر را وارد کن
        </p>
      </div>
    </div>
    <button
      (click)="close.emit()"
      class="w-10 h-10 rounded-xl border border-white/10 bg-white/5 hover:bg-red-500/20 transition-all flex items-center justify-center"
    >
      <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none">
        <path
          d="M6 6l12 12M18 6 6 18"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>

  <div class="p-4 sm:p-6 flex flex-col gap-5" [formGroup]="form">
    <div>
      <h3 class="yekan font-bold mb-3">تصویر دسته‌بندی</h3>
      @if (imgSRC === null) {
        <label class="cursor-pointer block">
          <div
            class="h-[12rem] rounded-[1.4rem] border-2 border-dashed border-white/15 bg-white/5 hover:bg-white/10 transition-all flex flex-col items-center justify-center gap-3"
          >
            <div
              class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center"
            >
              <svg class="w-7 h-7 text-white/80" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 16V8m0 0-3 3m3-3 3 3"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <p class="yekan text-white/70 font-bold">آپلود تصویر</p>
          </div>
          <input
            type="file"
            accept="image/*"
            class="hidden"
            (input)="imageSelected.emit($event)"
          />
        </label>
      } @else {
        <div
          class="h-[12rem] rounded-[1.4rem] border border-white/10 bg-white/5 overflow-hidden flex items-center justify-center p-4"
        >
          <img
            [src]="imgSRC"
            class="max-h-full max-w-full object-contain rounded-2xl"
          />
        </div>
      }
    </div>

    <div class="flex flex-col gap-2">
      <label class="yekan font-semibold text-white/90">عنوان فارسی</label>
      <input
        formControlName="title"
        type="text"
        placeholder="مثلا: همبرگر"
        class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-4 text-white outline-none focus:border-amber-400 transition-all"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="yekan font-semibold text-white/90">شناسه انگلیسی</label>
      <input
        formControlName="slug"
        type="text"
        placeholder="مثلا: burger"
        class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-4 text-white outline-none focus:border-amber-400 transition-all"
        dir="ltr"
      />
      <p class="yekan text-white/40 text-xs">
        فقط حروف انگلیسی، عدد و خط تیره. این شناسه روی محصولات استفاده می‌شود.
      </p>
    </div>

    @if (errorMessage) {
      <div
        class="rounded-2xl border border-rose-500/20 bg-rose-500/10 px-4 py-3"
      >
        <p class="yekan text-sm font-bold text-rose-300">{{ errorMessage }}</p>
      </div>
    }
    @if (successMessage) {
      <div
        class="rounded-2xl border border-emerald-500/20 bg-emerald-500/10 px-4 py-3"
      >
        <p class="yekan text-sm font-bold text-emerald-300">
          {{ successMessage }}
        </p>
      </div>
    }

    <div class="flex flex-col sm:flex-row gap-3">
      <button
        type="button"
        (click)="submitForm.emit()"
        class="flex-1 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 px-6 py-4 yekan font-bold text-black hover:scale-[1.01] transition-all"
      >
        ذخیره دسته‌بندی
      </button>
      <button
        type="button"
        (click)="close.emit()"
        class="rounded-2xl border border-red-400/20 bg-red-500/10 px-6 py-4 yekan font-bold text-red-300 hover:bg-red-500/20 transition-all"
      >
        بستن
      </button>
    </div>
  </div>
</div>
