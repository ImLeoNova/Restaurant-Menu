<div
  class="w-full max-w-[36rem] rounded-[1.5rem] sm:rounded-[2rem] border border-white/10 bg-[#111827]/95 text-white shadow-2xl p-6 sm:p-8 text-center my-6"
  dir="rtl"
>
  <div class="flex flex-col items-center gap-4">
    <div
      class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-red-500/15 flex items-center justify-center border border-red-400/20"
    >
      <svg
        class="w-8 h-8 sm:w-9 sm:h-9 text-red-300"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M6 7h12M9 7V5h6v2m-7 3v7m4-7v7m4-7v7M8 19h8a1 1 0 0 0 1-1V7H7v11a1 1 0 0 0 1 1Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <h1 class="yekan text-[1.4rem] sm:text-[1.8rem] font-extrabold">
      حذف محصول
    </h1>

    <p class="yekan text-white/60 text-[0.9rem] sm:text-[1rem]">
      آیا از حذف این محصول مطمئن هستی؟
    </p>

    @if (selectedProduct) {
      <div
        class="w-full rounded-2xl border border-white/10 bg-white/5 p-4 text-right"
      >
        <h2 class="yekan font-extrabold text-[1.1rem] text-white">
          {{ selectedProduct.title }}
        </h2>
        <p class="yekan text-white/60 mt-2 text-[0.9rem]">
          {{ selectedProduct.description }}
        </p>
        <p class="yekan text-amber-300 mt-3 font-bold">
          {{ selectedProduct.price }}
        </p>
      </div>
    }

    @if (errorMessage !== undefined) {
      <div
        class="w-full rounded-2xl border border-rose-500/20 bg-rose-500/10 px-4 py-3"
      >
        <h1
          class="yekan text-[0.85rem] sm:text-[0.9rem] font-bold text-rose-300 break-words"
        >
          {{ errorMessage }}
        </h1>
      </div>
    }

    @if (successMessage !== undefined) {
      <div
        class="w-full rounded-2xl border border-emerald-500/20 bg-emerald-500/10 px-4 py-3"
      >
        <h1
          class="yekan text-[0.85rem] sm:text-[0.9rem] font-bold text-emerald-300 break-words"
        >
          {{ successMessage }}
        </h1>
      </div>
    }

    <div class="mt-3 flex flex-col sm:flex-row gap-3">
      <button
        (click)="confirm.emit()"
        class="rounded-2xl bg-red-600 px-6 py-4 yekan font-bold text-white hover:bg-red-700 transition-all"
      >
        حذف نهایی
      </button>

      <button
        (click)="close.emit()"
        class="rounded-2xl bg-red-500/15 border border-red-400/20 px-6 py-4 yekan font-bold text-red-300 hover:bg-red-500/25 transition-all"
      >
        بستن
      </button>
    </div>
  </div>
</div>
