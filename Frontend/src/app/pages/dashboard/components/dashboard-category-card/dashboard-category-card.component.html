<div
  class="group rounded-[1.6rem] sm:rounded-[2rem] overflow-hidden border transition-all duration-300 shadow-lg hover:shadow-2xl hover:-translate-y-1 min-w-0"
  [ngClass]="{
    'border-amber-400/40 bg-gradient-to-b from-amber-500/20 to-[#131a2d]': active,
    'border-white/10 bg-[#131a2d]/90 hover:bg-[#182039]': !active,
  }"
>
  <button
    type="button"
    class="w-full text-right"
    (click)="view.emit(category)"
  >
    <div
      class="relative h-[11rem] sm:h-[12.5rem] overflow-hidden bg-gradient-to-br from-white/10 to-white/5 flex items-center justify-center"
    >
      @if (category.image) {
        <img
          [src]="category.image"
          [alt]="category.title"
          class="w-[7.5rem] h-[7.5rem] sm:w-[9.5rem] sm:h-[9.5rem] object-contain group-hover:scale-110 transition-all duration-500"
        />
      } @else {
        <div
          class="w-20 h-20 rounded-2xl bg-amber-500/15 border border-amber-400/20 flex items-center justify-center"
        >
          <svg class="w-8 h-8 text-amber-300" viewBox="0 0 24 24" fill="none">
            <path
              d="M4 7.5 12 4l8 3.5M4 7.5V16L12 20m-8-12.5L12 11m8-3.5V16L12 20m0-9v9"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      }
      <div
        class="absolute inset-0 bg-gradient-to-t from-black/35 to-transparent"
      ></div>
    </div>

    <div class="p-4 sm:p-5 flex flex-col gap-3 min-w-0" dir="rtl">
      <div class="min-w-0">
        <h1
          class="text-white text-[1.15rem] sm:text-[1.3rem] font-extrabold yekan leading-8 break-words"
        >
          {{ category.title }}
        </h1>
        <p class="yekan text-white/45 text-sm mt-1 break-all">
          {{ category.category }}
        </p>
      </div>

      <div
        class="inline-flex self-start items-center gap-2 rounded-full bg-amber-500/10 border border-amber-400/20 px-3 py-1.5"
      >
        <span class="yekan text-amber-300 text-sm font-bold">
          {{ category.product_count || 0 }} محصول
        </span>
      </div>
    </div>
  </button>

  <div
    class="px-4 sm:px-5 pb-4 sm:pb-5 flex items-center gap-2"
    dir="rtl"
  >
    <button
      type="button"
      class="flex-1 rounded-xl bg-amber-500/15 border border-amber-400/20 text-amber-300 py-2.5 yekan font-bold text-sm hover:bg-amber-500/25 transition-all"
      (click)="edit.emit(category)"
    >
      ویرایش
    </button>
    <button
      type="button"
      class="flex-1 rounded-xl bg-red-500/15 border border-red-400/20 text-red-300 py-2.5 yekan font-bold text-sm hover:bg-red-500/25 transition-all"
      (click)="remove.emit(category)"
    >
      حذف
    </button>
  </div>
</div>
