<section
  class="relative z-10 px-4 sm:px-8 lg:px-16 xl:px-24 pb-10 sm:pb-14"
  dir="rtl"
>
  <div class="max-w-[90rem] mx-auto">
    <div
      class="rounded-[2rem] border border-amber-400/10 bg-gradient-to-br from-amber-500/15 via-orange-500/10 to-transparent p-5 sm:p-7 shadow-2xl backdrop-blur-xl overflow-hidden"
    >
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6"
      >
        <div class="min-w-0">
          <h1
            class="text-white yekan font-extrabold text-[1.7rem] sm:text-[2.2rem] break-words"
          >
            دسته‌بندی‌ها
          </h1>
          <p class="yekan text-white/60 text-[0.9rem] sm:text-[1rem] mt-1">
            دسته‌بندی مورد نظرت را انتخاب کن و غذاهای همان بخش را ببین.
          </p>
        </div>

        <div
          class="flex items-center gap-3 rounded-2xl bg-black/20 border border-white/10 px-4 py-3 shrink-0"
        >
          <svg class="w-5 h-5 text-amber-300" viewBox="0 0 24 24" fill="none">
            <path
              d="M4 7.5 12 4l8 3.5M4 7.5V16L12 20m-8-12.5L12 11m8-3.5V16L12 20m0-9v9"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
          <span class="yekan text-white/80 text-[0.85rem] sm:text-[0.95rem]">
            {{ categories.length }} دسته فعال
          </span>
        </div>
      </div>

      <div
        class="flex gap-3 sm:gap-4 z-10 mt-4 justify-start overflow-x-auto w-full items-stretch pb-2"
        dir="rtl"
      >
        @for (categoryITEM of categories; track categoryITEM.category) {
          <div
            class="w-[9rem] sm:w-[10rem] text-white transition-all duration-300 cursor-pointer hover:-translate-y-1 h-[11rem] sm:h-[12rem] justify-center items-center flex-none rounded-[1.6rem] flex flex-col gap-3 border"
            (click)="categoryChange.emit(categoryITEM.category)"
            [ngClass]="{
              'bg-gradient-to-b from-amber-400/30 to-orange-500/10 border-amber-300/40 shadow-[0_20px_50px_rgba(245,158,11,0.18)]':
                categoryITEM.category == nowCategory,
              'bg-white/5 border-white/10 hover:bg-white/10':
                categoryITEM.category !== nowCategory,
            }"
          >
            <div
              class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-white/10 border border-white/10 flex items-center justify-center overflow-hidden"
            >
              <img
                class="w-[3.5rem] h-[3.5rem] sm:w-[4.5rem] sm:h-[4.5rem] object-contain"
                [src]="categoryITEM.image"
                [title]="categoryITEM.title"
                [alt]="categoryITEM.title"
                loading="lazy"
                decoding="async"
              />
            </div>
            <h1
              class="yekan font-bold text-center text-[0.95rem] sm:text-[1rem] px-2 break-words"
            >
              {{ categoryITEM.title }}
            </h1>
          </div>
        }
      </div>
    </div>
  </div>
</section>
