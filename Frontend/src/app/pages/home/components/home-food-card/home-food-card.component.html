<div
  class="group bg-white/5 border border-white/10 hover:bg-white/10 transition-all duration-300 shadow-xl hover:shadow-2xl rounded-[1.7rem] overflow-hidden flex flex-col min-w-0 hover:-translate-y-1"
>
  <div
    class="relative h-[15rem] sm:h-[16rem] bg-gradient-to-br from-amber-500/10 to-orange-500/5 flex items-center justify-center overflow-hidden"
  >
    <div
      class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(251,191,36,0.14),transparent_45%)]"
    ></div>
    <img
      [src]="foodItem.image"
      class="relative w-[10rem] sm:w-[12rem] object-contain group-hover:scale-110 transition-all duration-500"
      [alt]="foodItem.title"
    />
    <div
      class="absolute top-4 right-4 rounded-full px-3 py-1.5 bg-black/30 border border-white/10 backdrop-blur-xl"
    >
      <span class="yekan text-[0.75rem] text-white/90">ویژه</span>
    </div>
  </div>

  <div class="p-5 flex flex-col gap-4 min-w-0">
    <div class="flex flex-col gap-2 min-w-0">
      <h1
        class="text-white text-[1.2rem] sm:text-[1.4rem] font-extrabold text-right yekan break-words"
      >
        {{ foodItem.title }}
      </h1>
      <p
        class="font-normal text-gray-300 h-auto min-h-[5rem] leading-7 text-[0.9rem] break-words"
      >
        {{ foodItem.description }}
      </p>
    </div>

    <div
      class="flex items-center justify-between gap-3 pt-3 border-t border-white/10"
    >
      <div class="flex flex-col min-w-0">
        <span class="yekan text-white/50 text-[0.75rem]">قیمت</span>
        <p
          class="font-extrabold text-amber-400 text-[1.05rem] sm:text-[1.15rem] text-center sm:text-right break-words"
        >
          {{ foodItem.price }} هزار تومن
        </p>
      </div>

      <div class="flex flex-col items-end gap-2 shrink-0">
        <div
          class="flex items-center gap-2 rounded-2xl border border-white/10 bg-black/20 px-2 py-2"
        >
          <button
            type="button"
            (click)="decreaseQuantity()"
            class="h-8 w-8 rounded-xl bg-white/10 text-white"
          >
            −
          </button>
          <span class="yekan min-w-8 text-center text-white">{{
            quantity
          }}</span>
          <button
            type="button"
            (click)="increaseQuantity()"
            class="h-8 w-8 rounded-xl bg-white/10 text-white"
          >
            ＋
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button
            type="button"
            (click)="emitAddToCart()"
            class="rounded-2xl px-3 py-2 bg-gradient-to-r from-amber-400 to-orange-500 text-black yekan font-bold hover:scale-[1.03] transition-all duration-300 shadow-lg"
          >
            افزودن
          </button>
          <a
            [routerLink]="['/restaurant-menu/product', foodItem.product_ID]"
            class="rounded-2xl px-3 py-2 bg-white/10 text-white yekan font-bold hover:bg-white/15 transition-all duration-300"
          >
            بیشتر
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
