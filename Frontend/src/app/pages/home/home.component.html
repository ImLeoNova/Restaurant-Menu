<main class="w-full min-h-screen bg-[#0b0f19] overflow-x-hidden">
  <app-home-background />

  <div class="w-full min-h-screen relative">
    <div class="pattern-b absolute top-0 left-0 w-full z-0 opacity-30 pointer-events-none"></div>

    <div class="flex justify-center items-center p-3 sm:p-5 z-20 sticky top-0 relative">
      <div class="w-full max-w-[90rem]">
        <app-header class="block w-full"></app-header>
      </div>
    </div>

    <app-home-hero
      [categoriesCount]="categories.length"
      [activeProductsCount]="currentProducts.length"
    />

    <app-home-features />

    <app-home-categories
      [categories]="categories"
      [nowCategory]="categoryService.nowCategory"
      (categoryChange)="onCategoryChange($event)"
    />

    <div id="products" class="scroll-mt-28">
      <app-home-products-header
        [categoryTitle]="currentCategory.title"
        [categoryImage]="currentCategory.image"
        [productsCount]="currentProducts.length"
      />

      <app-home-products [products]="currentProducts" />
    </div>

    <div id="about-us" class="scroll-mt-28">
      <app-home-about />
    </div>

    <app-footer class="hidden md:block mt-6"></app-footer>
  </div>
</main>

<app-ai
  class="fixed left-[1rem] bottom-[1rem] z-[99] max-[768px]:left-2 max-[768px]:bottom-4"
></app-ai>
